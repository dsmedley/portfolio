{{- define "main" }}

<header class="page-header">
  {{- partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <div class="post-description">{{ . | markdownify }}</div>
  {{- end }}
</header>

{{- with .Content }}
<div class="post-content">{{ . }}</div>
{{- end }}

{{- partial "project-grid.html" . }}

{{- end }}
