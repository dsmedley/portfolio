[settings]
experimental = true
lockfile = true

[tools]
hugo = "0.165.0"
node = "26.2.0"
markdownlint-cli2 = "0.23.2"
"npm:cspell" = "10.2.2"
git-lfs = "3.8.0"
taplo = "0.10.0"
lefthook = "2.1.12"
lychee = "0.24.2"

[tasks.sync]
description = "Ensure this machine has everything needed to work on the repo"
depends = ["sync:*"]

[tasks.check]
description = "Run all validations (formatting, markdown, spelling, TOML)"
depends = ["check:format", "check:markdown", "check:spelling", "check:toml"]

[tasks.dev]
description = "Run the Hugo dev server with drafts enabled"
run = "hugo server --buildDrafts --buildFuture"

[tasks.build]
description = "Build the production site into public/"
run = "hugo --environment production --gc --minify --cleanDestinationDir"

[hooks]
enter = [{ task = "sync" }]
